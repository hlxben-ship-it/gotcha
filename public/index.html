<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gotcha</title>
<style>
  :root { --bg:#111317; --panel:#1a1d23; --line:#2a2e36; --text:#e7e9ee; --dim:#8b919c; --accent:#ffb020; --ok:#3ecf8e; --err:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 80px; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.5px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--dim); margin:0 0 20px; }
  .bar { display:flex; gap:8px; }
  input[type=url] { flex:1; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15px; }
  button, select { padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; font-size:14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin:14px 0; color:var(--dim); }
  .msg.err { color:var(--err); }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:18px 0 12px; }
  .toolbar .grow { flex:1; color:var(--dim); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; }
  .card.sel { border-color:var(--accent); }
  .card .thumb { aspect-ratio:16/9; background:#000 center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; }
  .card .info { padding:8px 10px; }
  .card .t { font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .m { color:var(--dim); font-size:12px; margin-top:4px; }
  .card input { position:absolute; top:8px; left:8px; width:18px; height:18px; accent-color:var(--accent); }
  h2 { font-size:16px; margin:32px 0 10px; display:flex; gap:8px; align-items:center; }
  h2 .sp { flex:1; }
  .job { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .job .row { display:flex; gap:10px; align-items:center; }
  .job .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .job .st { font-size:12px; color:var(--dim); white-space:nowrap; }
  .job .st.done { color:var(--ok); } .job .st.error { color:var(--err); }
  .prog { height:4px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .job.done .prog i { background:var(--ok); }
  .job .e { color:var(--err); font-size:12px; margin-top:6px; }
  .x { padding:2px 8px; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Gotcha<span>.</span></h1>
  <p class="sub">Paste a URL, see every video on it, grab the ones you want.</p>

  <form class="bar" id="form">
    <input type="url" id="url" placeholder="https://…" required autofocus>
    <button class="primary" id="go">Analyse</button>
  </form>
  <div class="msg" id="msg"></div>

  <section id="results" hidden>
    <div class="toolbar">
      <span class="grow" id="count"></span>
      <button id="all">Select all</button>
      <button id="none">Select none</button>
      <select id="quality">
        <option value="best">Best quality</option>
        <option value="1080">≤ 1080p</option>
        <option value="720">≤ 720p</option>
        <option value="480">≤ 480p</option>
        <option value="mp3">Audio only (mp3)</option>
      </select>
      <button class="primary" id="dl">Download selected</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <h2>Downloads <span class="sp"></span>
    <button class="x" id="clear">Clear finished</button>
    <button class="x" id="folder">Open folder</button>
  </h2>
  <div id="jobs"><div class="msg">Nothing yet.</div></div>
</main>

<script>
const $ = id => document.getElementById(id);
let items = [];
const selected = new Set();

const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const dur = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '';

$('form').onsubmit = async e => {
  e.preventDefault();
  $('go').disabled = true;
  $('msg').className = 'msg';
  $('msg').textContent = 'Analysing… (playlists can take a moment)';
  $('results').hidden = true;
  try {
    const r = await api('/api/analyse', { url: $('url').value.trim() });
    items = r.items;
    selected.clear();
    items.forEach((_, i) => selected.add(i));
    $('msg').textContent = items.length
      ? `${r.title || ''}${r.source === 'scrape' ? ' — no extractor for this site, found direct media links instead' : ''}`
      : 'No videos found on that page.';
    render();
  } catch (err) {
    $('msg').className = 'msg err';
    $('msg').textContent = err.message;
  } finally {
    $('go').disabled = false;
  }
};

function render() {
  $('results').hidden = !items.length;
  $('count').textContent = `${selected.size} of ${items.length} selected`;
  $('grid').innerHTML = items.map((it, i) => `
    <div class="card ${selected.has(i) ? 'sel' : ''}" data-i="${i}">
      <input type="checkbox" ${selected.has(i) ? 'checked' : ''} tabindex="-1">
      <div class="thumb" style="${it.thumbnail ? `background-image:url('${esc(it.thumbnail)}')` : ''}">${it.thumbnail ? '' : 'no preview'}</div>
      <div class="info">
        <div class="t" title="${esc(it.title)}">${esc(it.title)}</div>
        <div class="m">${[dur(it.duration), it.uploader, it.heights?.[0] && `up to ${it.heights[0]}p`].filter(Boolean).map(esc).join(' · ')}</div>
      </div>
    </div>`).join('');
}

$('grid').onclick = e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const i = Number(card.dataset.i);
  selected.has(i) ? selected.delete(i) : selected.add(i);
  render();
};
$('all').onclick = () => { items.forEach((_, i) => selected.add(i)); render(); };
$('none').onclick = () => { selected.clear(); render(); };

$('dl').onclick = async () => {
  const picks = [...selected].map(i => ({ url: items[i].url, title: items[i].title }));
  if (!picks.length) return;
  await api('/api/download', { items: picks, quality: $('quality').value });
  poll();
};
$('clear').onclick = async () => { await api('/api/clear', {}); poll(); };
$('folder').onclick = () => api('/api/open-folder', {});

async function poll() {
  const jobs = await api('/api/jobs').catch(() => null);
  if (!jobs) return;
  $('jobs').innerHTML = jobs.length ? jobs.slice().reverse().map(j => {
    const st = j.status === 'running'
      ? (j.phase || `${j.percent.toFixed(1)}% · ${j.speed} · ETA ${j.eta}`)
      : j.status;
    return `<div class="job ${j.status}">
      <div class="row">
        <span class="name" title="${esc(j.title)}">${esc(j.title)}</span>
        <span class="st ${j.status}">${esc(st)} · ${esc(j.quality)}</span>
        ${['queued', 'running'].includes(j.status) ? `<button class="x" onclick="api('/api/jobs/${j.id}/cancel', {}).then(poll)">✕</button>` : ''}
      </div>
      <div class="prog"><i style="width:${j.percent}%"></i></div>
      ${j.error ? `<div class="e">${esc(j.error)}</div>` : ''}
    </div>`;
  }).join('') : '<div class="msg">Nothing yet.</div>';
}
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
